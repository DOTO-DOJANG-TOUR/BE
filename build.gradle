plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.doto'
version = '0.0.1-SNAPSHOT'
description = 'DOTO backend server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-71:3.15.3'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.4'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: [
                            // 인프라/설정
                            '**/config/**',
                            '**/*Application.class',
                            // 도메인 모델과 데이터 전달 객체
                            '**/domain/**/entity/**',
                            '**/domain/**/dto/**',
                            '**/global/common/BaseTimeEntity.class',
                            // API 인터페이스와 공통 응답 모델
                            '**/*Api.class',
                            '**/global/api/**',
                            // 예외 코드·예외 처리 및 Repository
                            '**/domain/**/exception/**',
                            '**/global/error/**',
                            '**/domain/**/repository/**',
                            // 아직 미구현 또는 호출되지 않는 서비스
                            '**/domain/festival/service/FestivalCommandService.class',
                            '**/domain/tourspot/service/TourSpotQueryService.class',
                            '**/domain/tourex/scheduler/TourApiSyncScheduler.class',
                            // 인증·인가 및 OIDC 인프라
                            '**/global/security/CurrentMember.class',
                            '**/global/security/CurrentMemberArgumentResolver.class',
                            '**/global/security/CustomMemberDetails.class',
                            '**/global/security/JsonAuthenticationEntryPoint.class',
                            '**/global/security/jwt/JwtAuthenticationFilter.class',
                            '**/global/security/oidc/**'
                    ])
                })
        )
    }
}

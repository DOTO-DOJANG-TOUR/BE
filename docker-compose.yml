services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doto
      POSTGRES_USER: doto
      POSTGRES_PASSWORD: doto
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doto -d doto"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - doto-postgres:/var/lib/postgresql/data

volumes:
  doto-postgres:

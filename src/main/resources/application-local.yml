spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doto}
    username: ${DB_USERNAME:doto}
    password: ${DB_PASSWORD:doto}

jwt:
  secret: ${JWT_SECRET:local-only-do-not-use-in-production-min-32-bytes-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

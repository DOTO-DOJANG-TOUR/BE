spring:
  config:
    import: optional:file:/app/config/.env[.properties]
  application:
    name: doto
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 20260806

server:
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

doto:
  cache:
    maximum-size: ${CACHE_MAXIMUM_SIZE:1000}
    expire-after-write: ${CACHE_EXPIRE_AFTER_WRITE:10m}

jwt:
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}

oidc:
  kakao:
    client-id: ${KAKAO_OIDC_CLIENT_ID:}
    issuer: https://kauth.kakao.com
    jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
  google:
    client-id: ${GOOGLE_OIDC_CLIENT_ID:}
    issuer: https://accounts.google.com
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

spring:
  application:
    name: doto
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

doto:
  cache:
    maximum-size: ${CACHE_MAXIMUM_SIZE:1000}
    expire-after-write: ${CACHE_EXPIRE_AFTER_WRITE:10m}

jwt:
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}

spring:
  application:
    name: doto
  profiles:
    default: local
  # 로컬 개발용 비공개 값(구글/카카오 client-id 등)을 담는 파일. 존재하지 않아도 구동에는 문제없다
  # (optional). 실제 값은 application-secret.properties(git-ignored)에서 채우고, 배포 환경에서는
  # 이 파일 대신 OS 환경 변수(GOOGLE_OIDC_CLIENT_ID 등)로 주입한다.
  config:
    import: optional:classpath:application-secret.properties
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 20260806

server:
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

doto:
  cache:
    maximum-size: ${CACHE_MAXIMUM_SIZE:1000}
    expire-after-write: ${CACHE_EXPIRE_AFTER_WRITE:10m}

jwt:
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}

# 모바일(Android/RN) 클라이언트가 구글/카카오 SDK로 발급받은 OIDC ID Token을 검증하기 위해 필요한 설정(aud)
oidc:
  google:
    issuer: https://accounts.google.com
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    client-id: ${GOOGLE_OIDC_CLIENT_ID:}
  kakao:
    issuer: https://kauth.kakao.com
    jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
    client-id: ${KAKAO_OIDC_CLIENT_ID:}
